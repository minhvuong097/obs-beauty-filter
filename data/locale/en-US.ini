Tooltip.Preset="Starting point for the controls below. Any manual change marks the selection as Custom."
Tooltip.PresetName="Name used by Save preset. 1-64 characters, unique among built-in and saved presets."
Tooltip.Amount="How much skin smoothing is applied. Raise until it looks right, then back off 10-20%."
Tooltip.Radius="Sampling radius in pixels at 1080p. It scales with the frame height, so 1440p and 4K keep the same look."
Tooltip.Detail="How much pore and texture detail is added back over the smoothed base. Higher keeps more texture."
Tooltip.SkinDetect="Process skin-coloured pixels only instead of the whole frame."
Tooltip.SkinSensitivity="Widens or tightens the skin mask. Lower it if walls or wood are treated as skin."
Tooltip.MaskPreview="Shows the skin mask in white. Use it to tune Skin sensitivity, then turn it off."
Tooltip.Brightness="Exposure-like brightness applied to the skin only."
Tooltip.Warmth="Warms or cools the skin without changing its overall brightness."
Tooltip.Saturation="Colour intensity of the skin."
Tooltip.Rosy="Adds a light pink tint to the skin."
Tooltip.Clarity="Microcontrast on non-skin areas, so eyes, hair and clothes stay sharp."
Tooltip.Glow="Soft light bloom limited to skin highlights."
Tooltip.LightBalance="Measures scene brightness (skin-weighted) and lifts or lowers exposure toward a neutral level. 0 = off, 1 = strongest."
Tooltip.FaceEnable="Uses a face box for the teeth and eye zones and rejects skin-coloured backgrounds."
Tooltip.Temporal="Blends the skin mask with previous frames. Higher is steadier but can ghost on fast head turns."
Tooltip.Teeth="Whitens teeth inside the mouth zone."
Tooltip.Eyes="Brightens the whites of the eyes inside the eye zones."
Tooltip.ZonePreview="Draws the face box, eye zones and mouth zone in colour."
Tooltip.FaceManual="Replaces automatic face detection with a box you position by hand."
Tooltip.FaceCenterX="Horizontal centre of the manual face box, 0 (left) to 1 (right)."
Tooltip.FaceCenterY="Vertical centre of the manual face box, 0 (top) to 1 (bottom)."
Tooltip.FaceWidth="Width of the manual face box as a fraction of the frame."
Tooltip.FaceHeight="Height of the manual face box as a fraction of the frame."
Tooltip.Quality="Resolution of the low-resolution base pass. Higher costs more GPU but keeps more detail at 1440p and 4K."
Tooltip.SplitView="Shows the original on the left and the processed result on the right."
Tooltip.Opacity="Blends the processed result with the original."
Tooltip.AntiBanding="Adds dithering to the 8-bit output to hide banding in smooth gradients."
