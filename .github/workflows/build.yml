name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Version and docs consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # CMakeLists.txt is the source of truth; the installer, both READMEs and
      # CHANGELOG.md must agree.  On a tag the tag itself is checked too, so a
      # mistyped tag fails here instead of publishing the wrong version.
      - name: Check version consistency
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: sh .github/scripts/check-version.sh "$TAG"

      # Cheap guard for the helper scripts: a syntax error there only shows up
      # when a tag is already pushed, which is the worst possible time.
      - name: Syntax-check helper scripts
        run: |
          for script in .github/scripts/*.sh; do
            sh -n "$script"
            echo "ok: $script"
          done

  linux:
    name: Linux x86_64 (Alpine 3.21, OBS 30.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in Alpine container
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            alpine:3.21 \
            sh /workspace/.github/scripts/build-linux-ci.sh

      - name: Show package checksum
        run: sha256sum obs-beauty-filter-linux-x86_64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: obs-beauty-filter-linux-x86_64
          path: obs-beauty-filter-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 (OBS 33.0.1)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test and package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/build-windows-ci.ps1

      - name: Show package checksums
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path . -Filter "obs-beauty-filter-*-windows-x64*"
          if (-not $packages) { throw "Windows packages not found" }
          Get-FileHash -Algorithm SHA256 $packages.FullName |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: obs-beauty-filter-windows-x64
          path: |
            obs-beauty-filter-*-windows-x64.zip
            obs-beauty-filter-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # GitHub's generated notes only contain a "Full Changelog" link, so the
      # body comes from .github/release-notes/<tag>.md or the matching
      # CHANGELOG.md section instead.
      - name: Extract release notes
        run: sh .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="OBS Beauty Filter ${GITHUB_REF_NAME}"
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              "${notes[@]}"
            gh release upload "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              "${notes[@]}" \
              --verify-tag
          fi

      # Signed in Sigstore's public transparency log.  Anyone can check that
      # the binaries came from this workflow instead of trusting the upload.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.tar.gz
