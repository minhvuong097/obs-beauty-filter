name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (Alpine 3.21, OBS 30.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test in Alpine container
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            alpine:3.21 \
            sh /workspace/.github/scripts/build-linux-ci.sh

      - name: Show package checksum
        run: sha256sum obs-beauty-filter-linux-x86_64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: obs-beauty-filter-linux-x86_64
          path: obs-beauty-filter-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 (OBS 33.0.1)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test and package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/build-windows-ci.ps1

      - name: Show package checksums
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path . -Filter "obs-beauty-filter-*-windows-x64*"
          if (-not $packages) { throw "Windows packages not found" }
          Get-FileHash -Algorithm SHA256 $packages.FullName |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: obs-beauty-filter-windows-x64
          path: |
            obs-beauty-filter-*-windows-x64.zip
            obs-beauty-filter-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30
