name: Feature request
description: Suggest a control, preset, platform or workflow improvement.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that the filter does not support today?
      placeholder: "I stream at 1440p60 on an Intel iGPU and need a lighter preset..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Image quality
        - Presets / UI
        - Performance
        - HDR
        - Face detection
        - Packaging / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware and resolution (optional)
      placeholder: "i5-1235U / Iris Xe, 1080p60"
